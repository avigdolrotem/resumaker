# Gitleaks configuration for resumaker
# Scans for accidentally committed secrets
# Run manually: gitleaks detect --source . --verbose

title = "Resumaker gitleaks config"

[extend]
# Use the default ruleset as base
useDefault = true

[[rules]]
id = "anthropic-api-key"
description = "Anthropic API key"
regex = '''sk-ant-api[0-9]{2}-[A-Za-z0-9_\-]{90,}'''
keywords = ["sk-ant"]

[[rules]]
id = "aws-access-key-id"
description = "AWS Access Key ID"
regex = '''(AKIA|ASIA)[0-9A-Z]{16}'''
keywords = ["AKIA", "ASIA"]

[[rules]]
id = "stripe-secret-key"
description = "Stripe secret key"
regex = '''sk_(test|live)_[0-9a-zA-Z]{24,}'''
keywords = ["sk_test", "sk_live"]

[[rules]]
id = "google-oauth-client-secret"
description = "Google OAuth Client Secret"
regex = '''GOCSPX-[A-Za-z0-9_\-]{28}'''
keywords = ["GOCSPX"]

[allowlist]
description = "Allow-list false positives"
paths = [
  '''\.env\.example$''',
  '''docs/.*\.md$''',
  '''README\.md$''',
  '''\.gitleaks\.toml$''',
  '''pnpm-lock\.yaml$''',
]
regexes = [
  # Placeholder values used in examples
  '''sk-ant-api03-\.\.\.''',
  '''sk_test_\.\.\.''',
  '''GOCSPX-placeholder''',
]
