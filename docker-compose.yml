# Local development infrastructure
# Usage:
#   docker-compose up -d     # Start everything
#   docker-compose down      # Stop everything
#   docker-compose logs -f   # Tail all logs

services:
  postgres:
    image: postgres:17-alpine
    container_name: resumaker-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: resumaker
      POSTGRES_PASSWORD: devpassword
      POSTGRES_DB: resumaker
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U resumaker"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: resumaker-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  localstack:
    image: localstack/localstack:3.8
    container_name: resumaker-localstack
    restart: unless-stopped
    environment:
      SERVICES: s3,secretsmanager
      DEBUG: 0
      DEFAULT_REGION: il-central-1
    ports:
      - "4566:4566"
    volumes:
      - localstack_data:/var/lib/localstack
      - /var/run/docker.sock:/var/run/docker.sock

  mailhog:
    image: mailhog/mailhog:latest
    container_name: resumaker-mailhog
    restart: unless-stopped
    ports:
      - "1025:1025"  # SMTP
      - "8025:8025"  # Web UI

volumes:
  postgres_data:
  redis_data:
  localstack_data:
