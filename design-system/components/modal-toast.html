<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Glass Modal &amp; Toast</title>
<style>
  :root { --brand-400: hsl(252 80% 65%); --accent-500: hsl(270 75% 58%); --spring-smooth: cubic-bezier(0.22, 1, 0.36, 1); --spring-snappy: cubic-bezier(0.34, 1.56, 0.64, 1); }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; font-family: -apple-system, 'Inter', system-ui, sans-serif;
    background: radial-gradient(circle at 60% 40%, #3b1f7a 0%, #1a1030 55%, #0d0818 100%);
    color: white; display: flex; align-items: center; justify-content: center;
  }
  .backdrop {
    position: fixed; inset: 0;
    background: rgba(10,6,20,0.55);
    backdrop-filter: blur(6px);
    display: flex; align-items: center; justify-content: center;
  }
  .modal {
    width: 380px; border-radius: 24px; padding: 28px;
    background: rgba(30,20,55,0.65);
    backdrop-filter: blur(28px) saturate(180%); -webkit-backdrop-filter: blur(28px) saturate(180%);
    border: 1px solid rgba(255,255,255,0.14);
    box-shadow: 0 24px 60px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.12);
    animation: pop-in 0.5s var(--spring-snappy);
  }
  @keyframes pop-in { 0% { opacity: 0; transform: scale(0.9) translateY(12px); } 100% { opacity: 1; transform: scale(1) translateY(0); } }
  .modal h3 { margin: 0 0 8px; font-size: 18px; }
  .modal p { margin: 0 0 22px; font-size: 13px; color: rgba(255,255,255,0.6); line-height: 1.5; }
  .modal .actions { display: flex; gap: 10px; justify-content: flex-end; }
  .btn { border: none; border-radius: 999px; padding: 10px 18px; font-size: 13px; font-weight: 600; cursor: pointer; font-family: inherit; }
  .btn.primary { background: linear-gradient(135deg, var(--brand-400), var(--accent-500)); color: white; box-shadow: 0 6px 18px rgba(139,92,246,0.4); }
  .btn.ghost { background: rgba(255,255,255,0.08); color: rgba(255,255,255,0.8); }

  .toast-stack { position: fixed; bottom: 28px; right: 28px; display: flex; flex-direction: column; gap: 10px; }
  .toast {
    display: flex; align-items: center; gap: 10px;
    padding: 12px 16px; border-radius: 14px; width: 280px;
    background: rgba(20,14,38,0.6);
    backdrop-filter: blur(20px) saturate(180%); -webkit-backdrop-filter: blur(20px) saturate(180%);
    border: 1px solid rgba(255,255,255,0.12);
    box-shadow: 0 10px 30px rgba(0,0,0,0.4);
    font-size: 13px;
    animation: slide-in 0.5s var(--spring-snappy);
  }
  @keyframes slide-in { 0% { opacity: 0; transform: translateX(30px); } 100% { opacity: 1; transform: translateX(0); } }
  .toast.success::before { content: '✓'; width: 22px; height: 22px; border-radius: 50%; background: #34d399; color: #06301f; display: flex; align-items: center; justify-content: center; font-size: 12px; flex-shrink: 0; }
</style>
</head>
<body>
  <div class="backdrop">
    <div class="modal">
      <h3>Delete this resume?</h3>
      <p>"Product Designer — Figma" will be permanently removed. This can't be undone.</p>
      <div class="actions">
        <button class="btn ghost">Cancel</button>
        <button class="btn primary">Delete</button>
      </div>
    </div>
  </div>
  <div class="toast-stack">
    <div class="toast success">Resume saved</div>
  </div>
</body>
</html>
