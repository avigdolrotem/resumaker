name: Deploy

# Triggered on:
#   - Tag push matching v*.*.*    → prod deploy
#   - workflow_dispatch            → manual deploy (any tag/sha to chosen env)
#
# Flow:
#   1. Build multi-arch container, push to ECR
#   2. Bump infra/helm/resumaker/values.<env>.image.yaml with new tag
#   3. Commit + push back to main — ArgoCD picks up the change
#
# Required secrets:
#   - AWS_DEPLOY_ROLE_ARN        OIDC role with ECR push + git commit perms
#   - AWS_REGION                  e.g. il-central-1
#   - AWS_ACCOUNT_ID              numeric account id
#   - GH_DEPLOY_TOKEN             PAT or App token with `contents: write`
#                                 (only needed if branch protection blocks GITHUB_TOKEN)

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        default: 'prod'
        type: choice
        options:
          - prod
          - staging
      image_tag:
        description: 'Image tag to deploy (sha or tag). Defaults to current SHA.'
        required: false
        type: string

concurrency:
  group: deploy-${{ github.event.inputs.environment || 'prod' }}
  cancel-in-progress: false # never cancel an in-flight prod deploy

permissions:
  id-token: write # OIDC for AWS
  contents: write # commit the values bump back

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  ECR_REGISTRY: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com
  IMAGE_NAME: resumaker-prod/web

jobs:
  build-and-push:
    name: Build & push image
    runs-on: ubuntu-latest
    timeout-minutes: 20

    outputs:
      image_tag: ${{ steps.meta.outputs.image_tag }}
      digest: ${{ steps.build.outputs.digest }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Compute image tag
        id: meta
        run: |
          if [[ "${{ github.event_name }}" == "push" ]]; then
            # Tag push: use the tag literally (vX.Y.Z)
            TAG="${GITHUB_REF##*/}"
          elif [[ -n "${{ github.event.inputs.image_tag }}" ]]; then
            TAG="${{ github.event.inputs.image_tag }}"
          else
            TAG="sha-${GITHUB_SHA::7}"
          fi
          echo "image_tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Building tag: ${TAG}"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set up QEMU (for multi-arch)
        uses: docker/setup-qemu-action@v3

      - name: Build & push container
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: true
          sbom: true
          tags: |
            ${{ env.ECR_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.image_tag }}
            ${{ env.ECR_REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ github.event.repository.updated_at }}

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ env.ECR_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.image_tag }}
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'
          exit-code: '0' # report but don't fail (handled by security.yml)

      - name: Upload Trivy SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-results.sarif'

  bump-image-tag:
    name: Bump image tag (GitOps)
    needs: build-and-push
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: needs.build-and-push.result == 'success'

    steps:
      - uses: actions/checkout@v4
        with:
          # Use a deploy token so the push triggers ArgoCD's git poll
          # but skips CI on the resulting commit (via [skip ci]).
          token: ${{ secrets.GH_DEPLOY_TOKEN || github.token }}
          fetch-depth: 0

      - name: Update image tag in values
        env:
          ENV_NAME: ${{ github.event.inputs.environment || 'prod' }}
          IMAGE_TAG: ${{ needs.build-and-push.outputs.image_tag }}
        run: |
          VALUES_FILE="infra/helm/resumaker/values.${ENV_NAME}.image.yaml"
          mkdir -p "$(dirname "$VALUES_FILE")"

          cat > "$VALUES_FILE" <<EOF
          # AUTO-GENERATED by .github/workflows/deploy.yml — do not edit by hand.
          # Bumped on each successful image build; ArgoCD syncs from this file.
          image:
            repository: ${{ env.ECR_REGISTRY }}/${{ env.IMAGE_NAME }}
            tag: "${IMAGE_TAG}"
            digest: "${{ needs.build-and-push.outputs.digest }}"
          EOF

          echo "Updated $VALUES_FILE:"
          cat "$VALUES_FILE"

      - name: Commit and push
        env:
          ENV_NAME: ${{ github.event.inputs.environment || 'prod' }}
          IMAGE_TAG: ${{ needs.build-and-push.outputs.image_tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          VALUES_FILE="infra/helm/resumaker/values.${ENV_NAME}.image.yaml"
          git add "$VALUES_FILE"

          if git diff --staged --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "chore(deploy): bump ${ENV_NAME} image to ${IMAGE_TAG} [skip ci]" \
                     -m "Source ref: ${{ github.ref }}" \
                     -m "Source SHA: ${{ github.sha }}"
          git push origin HEAD:main

      - name: Summary
        env:
          ENV_NAME: ${{ github.event.inputs.environment || 'prod' }}
          IMAGE_TAG: ${{ needs.build-and-push.outputs.image_tag }}
        run: |
          echo "### Deploy complete" >> "$GITHUB_STEP_SUMMARY"
          echo "- Environment: \`${ENV_NAME}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Image tag: \`${IMAGE_TAG}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- ArgoCD will pick up the change within ~3 minutes." >> "$GITHUB_STEP_SUMMARY"
