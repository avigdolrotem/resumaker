name: Deploy (GCP)

# Triggered on:
#   - Tag push matching v*.*.*    → build + push + scan a prod image
#   - workflow_dispatch            → manual build (any env)
#
# WHAT THIS DOES TODAY (always):
#   1. WIF auth to the target env's GCP project
#   2. Build multi-arch container, push to Artifact Registry
#   3. Trivy-scan the image (blocks on CRITICAL/HIGH CVEs)
#   4. Print the one-line `helm upgrade` rollout command in the job summary
#
# WHAT THIS DOES NOT DO (yet):
#   It does NOT roll the image out to the cluster automatically. Two reasons:
#     - ArgoCD is not installed (no `argocd` namespace / CRDs), so the
#       GitOps "commit values.<env>.image.yaml → auto-sync" path has nothing
#       watching it.
#     - The GKE control plane is IP-allowlisted to the operator's home IP
#       (master_authorized_networks), so a GitHub-hosted runner cannot reach
#       it to `helm upgrade` directly either.
#   Until one of those is addressed, rollout is the single documented
#   `helm upgrade` command emitted in the build summary (run it from a host
#   on the allowlisted network). The GitOps bump job below is retained but
#   DORMANT — it only runs when the repo variable ARGOCD_ENABLED == 'true',
#   so installing ArgoCD later flips automated sync on with no edit here.
#
# Required repo secrets / variables (already set via tofu output):
#   - secrets.WIF_PROVIDER          GitHub Actions WIF provider resource name
#   - secrets.WIF_SERVICE_ACCOUNT   cicd SA email (unused here; SA derived per-env)
#   - vars.ARGOCD_ENABLED           'true' once ArgoCD is installed (default unset)

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        default: 'prod'
        type: choice
        options:
          - dev
          - staging
          - prod
      image_tag:
        description: 'Image tag (sha or tag). Defaults to current SHA.'
        required: false
        type: string

concurrency:
  group: deploy-${{ github.event.inputs.environment || 'prod' }}
  cancel-in-progress: false # never cancel an in-flight prod deploy

permissions:
  id-token: write # WIF auth to GCP
  contents: write # commit the values bump back

env:
  REGION: europe-west1
  REPO: resumaker

jobs:
  build-and-push:
    name: Build & push image (GCP)
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || 'prod' }}
    timeout-minutes: 20

    outputs:
      image_tag: ${{ steps.meta.outputs.image_tag }}
      image_uri: ${{ steps.meta.outputs.image_uri }}
      digest: ${{ steps.build.outputs.digest }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute environment + tag
        id: meta
        run: |
          ENV="${{ github.event.inputs.environment || 'prod' }}"
          echo "env=$ENV" >> "$GITHUB_OUTPUT"
          echo "project_id=resumaker-$ENV" >> "$GITHUB_OUTPUT"

          if [[ "${{ github.event_name }}" == "push" ]]; then
            # Tag push: use the tag literally (vX.Y.Z)
            TAG="${GITHUB_REF##*/}"
          elif [[ -n "${{ github.event.inputs.image_tag }}" ]]; then
            TAG="${{ github.event.inputs.image_tag }}"
          else
            TAG="sha-${GITHUB_SHA::7}"
          fi
          echo "image_tag=${TAG}" >> "$GITHUB_OUTPUT"

          IMAGE="${{ env.REGION }}-docker.pkg.dev/resumaker-${ENV}/${{ env.REPO }}/web:${TAG}"
          echo "image_uri=${IMAGE}" >> "$GITHUB_OUTPUT"
          echo "Building: ${IMAGE}"

      - name: Authenticate to GCP via WIF
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: resumaker-cicd@${{ steps.meta.outputs.project_id }}.iam.gserviceaccount.com

      - uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Set up QEMU (for multi-arch)
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push container
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: true
          sbom: true
          build-args: |
            NEXT_PUBLIC_SENTRY_DSN=${{ secrets.NEXT_PUBLIC_SENTRY_DSN }}
            NEXT_PUBLIC_SENTRY_ENVIRONMENT=${{ steps.meta.outputs.env }}
          tags: |
            ${{ steps.meta.outputs.image_uri }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ github.event.repository.updated_at }}

      - name: Scan image with Trivy
        # Gate on the scan (table + exit-code) — blocks the deploy on
        # CRITICAL/HIGH image CVEs. No SARIF→Code-Scanning upload: that
        # needs GitHub Advanced Security, unavailable on this private repo
        # ("Resource not accessible by integration"). Same approach as the
        # security.yml trivy jobs.
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ steps.meta.outputs.image_uri }}
          format: 'table'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true
          exit-code: '1' # block build on CRITICAL/HIGH CVEs

      - name: Rollout instructions
        if: success()
        env:
          ENV_NAME: ${{ steps.meta.outputs.env }}
          IMAGE_TAG: ${{ steps.meta.outputs.image_tag }}
        run: |
          {
            echo "### ✅ Image built, pushed & scanned"
            echo ""
            echo "- Environment: \`${ENV_NAME}\`"
            echo "- Image: \`${{ steps.meta.outputs.image_uri }}\`"
            echo "- Digest: \`${{ steps.build.outputs.digest }}\`"
            echo ""
            echo "#### Roll it out"
            echo "ArgoCD is not installed and the GKE control plane is IP-allowlisted,"
            echo "so the rollout is one command from a host on the allowlisted network:"
            echo ""
            echo '```sh'
            echo "helm upgrade resumaker ./infra/helm/resumaker -n resumaker \\"
            echo "  -f infra/helm/resumaker/values.${ENV_NAME}.yaml \\"
            echo "  --set image.tag=${IMAGE_TAG} \\"
            echo "  --wait --timeout=10m --force-conflicts"
            echo '```'
            echo ""
            echo "Then verify: \`kubectl -n resumaker rollout status deploy/resumaker\`"
            echo "and \`curl -fsS https://resumaker.co.il/api/health/ready\`."
            echo ""
            echo "To make this automatic, install ArgoCD (manifests under \`infra/gitops/\`)"
            echo "and set repo variable \`ARGOCD_ENABLED=true\`."
          } >> "$GITHUB_STEP_SUMMARY"

  bump-image-tag:
    name: Bump image tag (GitOps / GCP)
    needs: build-and-push
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # DORMANT until ArgoCD is installed. ArgoCD watches
    # values.<env>.image.yaml in git and syncs the cluster; without it this
    # job would commit an orphan file nothing consumes. Flip on by setting
    # repo variable ARGOCD_ENABLED=true (no edit to this file needed).
    if: needs.build-and-push.result == 'success' && vars.ARGOCD_ENABLED == 'true'

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_DEPLOY_TOKEN || github.token }}
          fetch-depth: 0

      - name: Update image tag in values
        env:
          ENV_NAME: ${{ github.event.inputs.environment || 'prod' }}
          IMAGE_TAG: ${{ needs.build-and-push.outputs.image_tag }}
          IMAGE_URI: ${{ needs.build-and-push.outputs.image_uri }}
        run: |
          VALUES_FILE="infra/helm/resumaker/values.${ENV_NAME}.image.yaml"
          mkdir -p "$(dirname "$VALUES_FILE")"

          cat > "$VALUES_FILE" <<EOF
          # AUTO-GENERATED by .github/workflows/deploy.yml — do not edit by hand.
          # Bumped on each successful image build; ArgoCD syncs from this file.
          image:
            repository: ${{ env.REGION }}-docker.pkg.dev/resumaker-${ENV_NAME}/${{ env.REPO }}/web
            tag: "${IMAGE_TAG}"
            digest: "${{ needs.build-and-push.outputs.digest }}"
          EOF

          echo "Updated $VALUES_FILE:"
          cat "$VALUES_FILE"

      - name: Commit and push
        env:
          ENV_NAME: ${{ github.event.inputs.environment || 'prod' }}
          IMAGE_TAG: ${{ needs.build-and-push.outputs.image_tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          VALUES_FILE="infra/helm/resumaker/values.${ENV_NAME}.image.yaml"
          git add "$VALUES_FILE"

          if git diff --staged --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "chore(deploy/gcp): bump ${ENV_NAME} image to ${IMAGE_TAG} [skip ci]" \
                     -m "Source ref: ${{ github.ref }}" \
                     -m "Source SHA: ${{ github.sha }}"
          git push origin HEAD:main

      - name: Summary
        env:
          ENV_NAME: ${{ github.event.inputs.environment || 'prod' }}
          IMAGE_TAG: ${{ needs.build-and-push.outputs.image_tag }}
        run: |
          echo "### GCP Deploy complete" >> "$GITHUB_STEP_SUMMARY"
          echo "- Environment: \`${ENV_NAME}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Image tag: \`${IMAGE_TAG}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Registry: \`${{ env.REGION }}-docker.pkg.dev\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- ArgoCD will pick up the change within ~3 minutes." >> "$GITHUB_STEP_SUMMARY"
