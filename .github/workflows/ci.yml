name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-progress runs on the same branch
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NODE_VERSION: '22'
  PNPM_VERSION: '9'

jobs:
  setup:
    name: Install dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

  lint:
    name: Lint
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check

  typecheck:
    name: Typecheck
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck

  test:
    name: Unit tests
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      # `pnpm test --coverage` errored before running ANY test (pnpm parsed
      # --coverage as its own flag → "Unknown option: 'coverage'"), so this
      # gate silently never ran. Run unit suites across apps + packages,
      # excluding the Playwright E2E package (it has its own `e2e` job).
      # No coverage provider is installed; add @vitest/coverage-v8 to restore
      # coverage upload.
      - run: pnpm --filter "./apps/*" --filter "./packages/*" test
      - name: Upload coverage
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  build:
    name: Build
    needs: [lint, typecheck]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Build-time env stubs so apps/web/src/lib/env.ts's Zod prod-refines
    # don't fail page-data collection. Real values are injected at runtime
    # via the Helm chart's env block + ExternalSecrets — these are
    # obviously-fake placeholders so a leaked CI artifact can't be mistaken
    # for real config. Keep this list in sync with the parallel stubs in
    # apps/web/Dockerfile (the prod image build). env.ts has four
    # prod-refines (NODE_ENV=production): non-localhost APP_URL +
    # NEXT_PUBLIC_APP_URL + BETTER_AUTH_URL, and Boolean(CRON_SECRET).
    # DATABASE_URL is present so db/index.ts takes the lazy postgres path
    # at module load instead of the Cloud SQL Connector (which would dial
    # the GCP metadata server on the GitHub runner and stall the build).
    env:
      APP_URL: https://build.example.com
      BETTER_AUTH_URL: https://build.example.com
      NEXT_PUBLIC_APP_URL: https://build.example.com
      BETTER_AUTH_SECRET: build-stub-must-be-at-least-32-chars-long
      CRON_SECRET: build-stub-cron-secret-thirty-two-chars-min
      IP_HASH_SALT: build-stub-ip-hash-salt-thirty-two-chars-minimum-padding
      GCP_CLOUD_SQL_INSTANCE: build:stub:instance
      GCP_CLOUD_SQL_IAM_USER: build-stub@example.iam.gserviceaccount.com
      DATABASE_URL: postgres://build:build@127.0.0.1:5432/build_db
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

  e2e:
    name: E2E tests
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
