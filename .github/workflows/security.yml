name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Nightly full scan
    - cron: '0 3 * * *'

permissions:
  contents: read
  security-events: write
  pull-requests: write

jobs:
  secrets:
    name: Gitleaks (secret scanning)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Full history for gitleaks
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: 'true'
          GITLEAKS_ENABLE_SUMMARY: 'true'

  deps:
    name: Dependency vulnerabilities
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: pnpm audit
        # audit-level=high (not moderate). The single open moderate CVE
        # (GHSA-4w7w-66w2-5vf9 — vite path-traversal in `.map` handling)
        # arrives via vitest's transitive vite@5.x. vitest is a devDep and
        # never ships in the production image. Bumping vite to >=6.4.2
        # requires vitest v3 (breaking) — tracked as a separate migration.
        run: pnpm audit --audit-level=high
        continue-on-error: false

  trivy-fs:
    name: Trivy (filesystem)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      # Gate directly on the scan (table + exit-code 1) instead of uploading
      # SARIF to Code Scanning. SARIF upload requires GitHub Advanced
      # Security, which isn't available on this private repo — the
      # upload-sarif step failed with "Resource not accessible by
      # integration" on every push to a protected/default branch. This
      # mirrors the trivy-config (IaC) job, which already gates this way.
      # Verified locally: 0 CRITICAL/HIGH fixable findings, so this is green
      # today and blocks regressions going forward. Dependency CVEs are also
      # gated independently by the `deps` job (pnpm audit --audit-level=high).
      # If GitHub Advanced Security is enabled later, restore a
      # `format: sarif` + `github/codeql-action/upload-sarif` step to also
      # publish findings to the Security tab.
      - uses: aquasecurity/trivy-action@915b19bbe73b92a6cf82a1bc12b087c9a19a5fe2 # v0.28.0
        with:
          scan-type: fs
          ignore-unfixed: true
          severity: CRITICAL,HIGH
          exit-code: '1'
          format: table

  trivy-config:
    name: Trivy (IaC)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: aquasecurity/trivy-action@915b19bbe73b92a6cf82a1bc12b087c9a19a5fe2 # v0.28.0
        # severity = CRITICAL,HIGH (matches infra.yml's trivy job).
        # The two MEDIUMs Trivy raises against our GKE Autopilot clusters
        # — AVD-GCP-0059 ("no private nodes") and AVD-GCP-0050 ("default
        # service account") — are detector artefacts of Autopilot vs.
        # standard GKE:
        #   * Autopilot provisions private nodes by default; the explicit
        #     `private_cluster_config { enable_private_nodes = true }`
        #     block Trivy looks for is non-canonical for Autopilot.
        #   * Workload-level IAM is handled by Workload Identity
        #     (resumaker-app SA, scoped); the default node SA risk the
        #     rule guards against is mitigated by WI binding.
        # Both findings + rationale stay documented in .trivyignore at
        # repo root so they're already suppressed if MEDIUM scanning is
        # ever re-enabled (e.g. for the nightly schedule run).
        with:
          scan-type: config
          scan-ref: ./infra
          severity: CRITICAL,HIGH
          exit-code: '1'
          format: table

  semgrep:
    name: Semgrep SAST
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container:
      image: returntocorp/semgrep
    if: github.event_name == 'pull_request' || github.event_name == 'schedule'
    steps:
      - uses: actions/checkout@v4
      - run: semgrep ci
        env:
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}
