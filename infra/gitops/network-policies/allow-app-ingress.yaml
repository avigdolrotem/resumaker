# Ingress allowance for resumaker-web pods.
#
# Only the ALB ingress controller (which runs in kube-system) is allowed
# to reach the pod on port 3000. Health probes from kubelet are NOT
# affected by NetworkPolicy — kubelet is on the host network.

apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-alb-ingress
  namespace: resumaker
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: resumaker
  policyTypes:
    - Ingress
  ingress:
    - from:
        # ALB controller proxies traffic from the load balancer to the pod.
        # In target-type=ip mode the source IP is the ALB's own ENI in the VPC.
        - ipBlock:
            cidr: 10.0.0.0/16
      ports:
        - protocol: TCP
          port: 3000
