# Default-deny NetworkPolicy for the resumaker namespace.
#
# Without NetworkPolicies, GKE lets any pod talk to any other pod —
# including the Cloud SQL endpoint and the GCP Metadata server. This
# file locks the namespace down to "nothing by default" and the sibling
# `allow-*.yaml` files explicitly open the connectivity we need.
#
# Prerequisite: NetworkPolicy enforcement is enabled by default on GKE
# Autopilot. On Standard clusters, set `--enable-network-policy` (Calico
# under the hood). Without that, these manifests are inert.

apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: resumaker
spec:
  podSelector: {} # matches every pod in the namespace
  policyTypes:
    - Ingress
    - Egress
  # No `ingress` or `egress` rules = deny all
