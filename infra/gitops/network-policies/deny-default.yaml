# Default-deny NetworkPolicy for the resumaker namespace.
#
# Without NetworkPolicies, EKS lets any pod talk to any other pod —
# including the RDS endpoint and the IMDS metadata server. This file
# locks the namespace down to "nothing by default" and the sibling
# `allow-*.yaml` files explicitly open the connectivity we need.
#
# Prerequisite: NetworkPolicy enforcement must be enabled in vpc-cni
# (set `ENABLE_NETWORK_POLICY=true` in the addon's configuration_values,
# or install Calico / Cilium). Without that, these manifests are inert.

apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: resumaker
spec:
  podSelector: {} # matches every pod in the namespace
  policyTypes:
    - Ingress
    - Egress
  # No `ingress` or `egress` rules = deny all
