# Resumaker web application — synced from the Helm chart in the repo.
#
# values.yaml is the base; values.prod.yaml has prod overrides;
# values.prod.image.yaml is auto-generated by CI on each release
# and contains nothing but the latest image tag. Later files win.

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: resumaker-web
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    # Open the running app from ArgoCD UI
    link.argocd.argoproj.io/external-link: https://resumaker.co.il
spec:
  project: resumaker

  source:
    repoURL: https://github.com/rotem/resumaker.git # update to your repo
    targetRevision: main
    path: infra/helm/resumaker
    helm:
      releaseName: resumaker
      valueFiles:
        - values.yaml
        - values.prod.yaml
        - values.prod.image.yaml

  destination:
    server: https://kubernetes.default.svc
    namespace: resumaker

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 5
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 5m
    syncOptions:
      - CreateNamespace=false # namespace created by tofu
      - ServerSideApply=true
      - PruneLast=true

  # Ignore tofu-managed ServiceAccount annotations — IRSA role ARN
  # is set in tofu, not in the Helm chart.
  ignoreDifferences:
    - group: ''
      kind: ServiceAccount
      name: resumaker-web
      namespace: resumaker
      jsonPointers:
        - /metadata/annotations
