# Pulls the app-tier secret JSON from AWS Secrets Manager and
# materializes it as a Kubernetes Secret the Deployment mounts.
#
# The secret in AWS is keyed `resumaker-prod/app` (created by tofu)
# and contains a JSON blob like:
#   {
#     "DATABASE_URL": "...",
#     "BETTER_AUTH_SECRET": "...",
#     "ANTHROPIC_API_KEY": "sk-ant-...",
#     "RESEND_API_KEY": "re_...",
#     "STRIPE_SECRET_KEY": "sk_...",
#     "STRIPE_WEBHOOK_SECRET": "whsec_...",
#     "SENTRY_DSN": "..."
#   }
#
# Each top-level key becomes an env var in the pod via envFrom.

apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: resumaker-app
  namespace: resumaker
spec:
  refreshInterval: 5m
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    # Matches `{{ include "resumaker.fullname" . }}-app` in the chart
    name: resumaker-app
    creationPolicy: Owner
    deletionPolicy: Retain # never wipe live secrets if ESO is removed
    template:
      type: Opaque
      metadata:
        annotations:
          reloader.stakater.com/match: 'true'
  dataFrom:
    - extract:
        key: resumaker-prod/app
---
# Database credentials are managed separately by RDS (rotated by the
# Secrets Manager → RDS integration). Pull them out as their own
# K8s secret so the app can reference DATABASE_URL via a Postgres
# connection string we assemble at startup.

apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: resumaker-db
  namespace: resumaker
spec:
  refreshInterval: 15m
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    # Matches `{{ include "resumaker.fullname" . }}-db` in the chart
    name: resumaker-db
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      type: Opaque
      data:
        # Compose the Postgres connection string the chart expects under `url`
        url: 'postgres://{{ .username }}:{{ .password | urlquery }}@{{ .host }}:{{ .port }}/{{ .dbname }}?sslmode=require'
  dataFrom:
    - extract:
        key: resumaker-prod/db-credentials
---
# Redis connection URL — managed by the elasticache tofu module which
# publishes a JSON secret with `url`, `host`, `port`, `token` keys.

apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: resumaker-redis
  namespace: resumaker
spec:
  refreshInterval: 15m
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    # Matches `{{ include "resumaker.fullname" . }}-redis` in the chart
    name: resumaker-redis
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      type: Opaque
      data:
        url: '{{ .url }}'
  dataFrom:
    - extract:
        key: resumaker-prod/redis
