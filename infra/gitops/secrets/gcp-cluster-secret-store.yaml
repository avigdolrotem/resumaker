# GCP Secret Manager ClusterSecretStore.
# ESO uses Workload Identity (GKE pod SA annotation) to authenticate.
# The resumaker-app KSA must be annotated with the GCP SA email:
#   iam.gke.io/gcp-service-account: resumaker-app@resumaker-{env}.iam.gserviceaccount.com
#
# The AWS ClusterSecretStore (cluster-secret-store.yaml) is kept in place
# until Tofu state is migrated off AWS. Clean it up once EKS is decommissioned.
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: gcp-secret-manager
spec:
  provider:
    gcpsm:
      projectID: resumaker-prod # override per-env via Kustomize patches or separate overlay
      auth:
        workloadIdentity:
          clusterLocation: europe-west1
          clusterName: resumaker-prod
          serviceAccountRef:
            name: resumaker-app
            namespace: resumaker
