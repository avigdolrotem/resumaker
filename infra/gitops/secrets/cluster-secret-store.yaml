# Cluster-wide secret store: ESO pulls everything under
# `resumaker-prod/*` in AWS Secrets Manager.
#
# Authentication is via the IRSA role attached to the external-secrets
# ServiceAccount (provisioned by the EKS tofu module).

apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: aws-secrets-manager
spec:
  provider:
    aws:
      service: SecretsManager
      region: il-central-1
      auth:
        jwt:
          serviceAccountRef:
            name: external-secrets
            namespace: external-secrets
