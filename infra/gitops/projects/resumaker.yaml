# ArgoCD AppProject scoping all Resumaker apps.
#
# Why a project at all: lets us restrict which repos / namespaces / clusters
# a given set of Applications can target. Even though we only run one cluster
# today, the project ensures a future "support" or "marketing" namespace can't
# accidentally be deployed into by a misconfigured Application.

apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: resumaker
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  description: Resumaker app + supporting infra

  sourceRepos:
    - https://github.com/rotem/resumaker # update to your actual repo URL
    - https://github.com/*/resumaker.git
    - https://charts.external-secrets.io
    - https://argoproj.github.io/argo-helm

  destinations:
    - namespace: resumaker
      server: https://kubernetes.default.svc
    - namespace: resumaker-staging
      server: https://kubernetes.default.svc
    - namespace: external-secrets
      server: https://kubernetes.default.svc
    - namespace: argocd
      server: https://kubernetes.default.svc

  clusterResourceWhitelist:
    - group: ''
      kind: Namespace
    - group: 'external-secrets.io'
      kind: ClusterSecretStore

  namespaceResourceBlacklist:
    - group: ''
      kind: ResourceQuota

  roles:
    - name: read-only
      description: Read-only access for support/ops
      policies:
        - p, proj:resumaker:read-only, applications, get, resumaker/*, allow
