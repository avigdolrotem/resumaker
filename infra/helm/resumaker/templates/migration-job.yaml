{{- /*
Migration Job — runs `node apps/web/scripts/migrate.mjs` against
DATABASE_URL before the deployment rolls. Skipped when
`.Values.migrationJob.enabled` is false (today's default in prod
because the prod DB is already migrated and the standalone-image
migrator hasn't been validated end-to-end yet — see Phase 9 in
docs/SECURITY_AUDIT_2026-05-27.md).
*/ -}}
{{- if .Values.migrationJob.enabled -}}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "resumaker.fullname" . }}-migrate-{{ .Release.Revision }}
  labels:
    {{- include "resumaker.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: '-5'
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  ttlSecondsAfterFinished: 300
  backoffLimit: 2
  template:
    metadata:
      labels:
        {{- include "resumaker.selectorLabels" . | nindent 8 }}
        job-type: migration
    spec:
      restartPolicy: OnFailure
      serviceAccountName: {{ include "resumaker.serviceAccountName" . }}
      containers:
        - name: migrate
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          # Uses the runtime-only migrator at apps/web/scripts/migrate.mjs
          # (drizzle-kit is devDep and not present in the standalone image).
          command: ['node']
          args: ['apps/web/scripts/migrate.mjs']
          workingDir: /app
          env:
            - name: NODE_ENV
              value: production
            # Shares the runtime app secret instead of a separate -db
            # secret, because we live with a single kubectl-applied
            # `resumaker-app` Secret right now (see SECURITY_AUDIT
            # G.4 for the ESO reconciliation plan).
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "resumaker.fullname" . }}-app
                  key: DATABASE_URL
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
{{- end }}
