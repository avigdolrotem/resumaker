{{- if .Values.cronJobs.purge.enabled }}
# Daily compliance purge.
#
# GET /api/cron/purge does:
#   - Hard-delete users whose soft-delete is >30d old (cascades resumes,
#     generations, sessions, accounts, ats_scores, passkeys, cover_letters,
#     resume_versions, subscriptions)
#   - Drop expired verification tokens
#   - Drop expired sessions
#   - Trim audit_log older than 1 year
#
# Israeli Privacy Protection Law + GDPR both require honoring user
# deletion within a reasonable window. Without this CronJob the
# `users.deletedAt` rows pile up indefinitely and the soft-delete
# guarantee in the UI becomes a lie.
#
# Auth: Bearer token via CRON_SECRET (must match the value in the
# resumaker-app Secret). Curl-from-inside-the-cluster so the secret
# never leaves the VPC.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "resumaker.fullname" . }}-purge
  labels:
    {{- include "resumaker.labels" . | nindent 4 }}
spec:
  # 03:17 UTC daily = 05:17/06:17 Asia/Jerusalem (DST-dependent).
  # Off-peak for the IL audience. Prime-numbered minute avoids
  # the herd of crons that fire on the hour.
  schedule: {{ .Values.cronJobs.purge.schedule | quote }}
  timeZone: Etc/UTC
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 7
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 600

  jobTemplate:
    spec:
      ttlSecondsAfterFinished: 86400
      backoffLimit: 2
      template:
        metadata:
          labels:
            {{- include "resumaker.selectorLabels" . | nindent 12 }}
            job-type: purge
        spec:
          restartPolicy: OnFailure
          securityContext:
            runAsNonRoot: true
          containers:
            - name: purge
              # curlimages/curl is ~5MB vs pulling our own app image
              image: curlimages/curl:8.10.1
              securityContext:
                runAsNonRoot: true
                readOnlyRootFilesystem: true
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
              command:
                - sh
                - -c
                - |
                  set -e
                  curl --fail --show-error --silent \
                    --max-time 600 \
                    -H "Authorization: Bearer $CRON_SECRET" \
                    "http://{{ include "resumaker.fullname" . }}.{{ .Release.Namespace }}.svc.cluster.local/api/cron/purge"
              env:
                - name: CRON_SECRET
                  valueFrom:
                    secretKeyRef:
                      name: {{ include "resumaker.fullname" . }}-app
                      key: CRON_SECRET
              resources:
                requests:
                  cpu: 50m
                  memory: 32Mi
                limits:
                  cpu: 200m
                  memory: 64Mi
{{- end }}
