apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "resumaker.fullname" . }}
  labels:
    {{- include "resumaker.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "resumaker.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "resumaker.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "resumaker.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: web
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.targetPort }}
              protocol: TCP
          env:
            {{- range $k, $v := .Values.env }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
            # App secrets (pulled by external-secrets-operator into a k8s secret of the same name)
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "resumaker.fullname" . }}-app
                  key: ANTHROPIC_API_KEY
            - name: BETTER_AUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "resumaker.fullname" . }}-app
                  key: BETTER_AUTH_SECRET
            - name: BETTER_AUTH_URL
              value: {{ .Values.env.APP_URL | quote }}
            - name: RESEND_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "resumaker.fullname" . }}-app
                  key: RESEND_API_KEY
                  optional: true
            - name: SENTRY_DSN
              valueFrom:
                secretKeyRef:
                  name: {{ include "resumaker.fullname" . }}-app
                  key: SENTRY_DSN
                  optional: true
            - name: CRON_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "resumaker.fullname" . }}-app
                  key: CRON_SECRET
                  optional: true
            # Stripe (no-op until PAYMENT_PROVIDER=stripe)
            - name: STRIPE_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "resumaker.fullname" . }}-app
                  key: STRIPE_SECRET_KEY
                  optional: true
            - name: STRIPE_PUBLISHABLE_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "resumaker.fullname" . }}-app
                  key: STRIPE_PUBLISHABLE_KEY
                  optional: true
            - name: STRIPE_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "resumaker.fullname" . }}-app
                  key: STRIPE_WEBHOOK_SECRET
                  optional: true
            - name: STRIPE_PRICE_PLUS_MONTHLY
              valueFrom:
                secretKeyRef:
                  name: {{ include "resumaker.fullname" . }}-app
                  key: STRIPE_PRICE_PLUS_MONTHLY
                  optional: true
            - name: STRIPE_PRICE_PLUS_YEARLY
              valueFrom:
                secretKeyRef:
                  name: {{ include "resumaker.fullname" . }}-app
                  key: STRIPE_PRICE_PLUS_YEARLY
                  optional: true
            - name: STRIPE_PRICE_PLUS_QUARTERLY
              valueFrom:
                secretKeyRef:
                  name: {{ include "resumaker.fullname" . }}-app
                  key: STRIPE_PRICE_PLUS_QUARTERLY
                  optional: true
            - name: STRIPE_PRICE_PRO_MONTHLY
              valueFrom:
                secretKeyRef:
                  name: {{ include "resumaker.fullname" . }}-app
                  key: STRIPE_PRICE_PRO_MONTHLY
                  optional: true
            - name: STRIPE_PRICE_PRO_YEARLY
              valueFrom:
                secretKeyRef:
                  name: {{ include "resumaker.fullname" . }}-app
                  key: STRIPE_PRICE_PRO_YEARLY
                  optional: true
            - name: STRIPE_PRICE_PRO_QUARTERLY
              valueFrom:
                secretKeyRef:
                  name: {{ include "resumaker.fullname" . }}-app
                  key: STRIPE_PRICE_PRO_QUARTERLY
                  optional: true
            # LemonSqueezy (Merchant of Record — no Israeli biz number needed)
            - name: LEMONSQUEEZY_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "resumaker.fullname" . }}-app
                  key: LEMONSQUEEZY_API_KEY
                  optional: true
            - name: LEMONSQUEEZY_STORE_ID
              valueFrom:
                secretKeyRef:
                  name: {{ include "resumaker.fullname" . }}-app
                  key: LEMONSQUEEZY_STORE_ID
                  optional: true
            - name: LEMONSQUEEZY_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "resumaker.fullname" . }}-app
                  key: LEMONSQUEEZY_WEBHOOK_SECRET
                  optional: true
            - name: LEMONSQUEEZY_VARIANT_PLUS_MONTHLY
              valueFrom:
                secretKeyRef:
                  name: {{ include "resumaker.fullname" . }}-app
                  key: LEMONSQUEEZY_VARIANT_PLUS_MONTHLY
                  optional: true
            - name: LEMONSQUEEZY_VARIANT_PLUS_YEARLY
              valueFrom:
                secretKeyRef:
                  name: {{ include "resumaker.fullname" . }}-app
                  key: LEMONSQUEEZY_VARIANT_PLUS_YEARLY
                  optional: true
            - name: LEMONSQUEEZY_VARIANT_PLUS_QUARTERLY
              valueFrom:
                secretKeyRef:
                  name: {{ include "resumaker.fullname" . }}-app
                  key: LEMONSQUEEZY_VARIANT_PLUS_QUARTERLY
                  optional: true
            - name: LEMONSQUEEZY_VARIANT_PRO_MONTHLY
              valueFrom:
                secretKeyRef:
                  name: {{ include "resumaker.fullname" . }}-app
                  key: LEMONSQUEEZY_VARIANT_PRO_MONTHLY
                  optional: true
            - name: LEMONSQUEEZY_VARIANT_PRO_YEARLY
              valueFrom:
                secretKeyRef:
                  name: {{ include "resumaker.fullname" . }}-app
                  key: LEMONSQUEEZY_VARIANT_PRO_YEARLY
                  optional: true
            - name: LEMONSQUEEZY_VARIANT_PRO_QUARTERLY
              valueFrom:
                secretKeyRef:
                  name: {{ include "resumaker.fullname" . }}-app
                  key: LEMONSQUEEZY_VARIANT_PRO_QUARTERLY
                  optional: true
            # OAuth providers (optional — no-op when unset)
            - name: GOOGLE_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: {{ include "resumaker.fullname" . }}-app
                  key: GOOGLE_CLIENT_ID
                  optional: true
            - name: GOOGLE_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "resumaker.fullname" . }}-app
                  key: GOOGLE_CLIENT_SECRET
                  optional: true
            - name: GITHUB_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: {{ include "resumaker.fullname" . }}-app
                  key: GITHUB_CLIENT_ID
                  optional: true
            - name: GITHUB_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "resumaker.fullname" . }}-app
                  key: GITHUB_CLIENT_SECRET
                  optional: true
            # DB URL from the Cloud SQL-managed secret
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "resumaker.fullname" . }}-db
                  key: url
            # Redis URL — rate limiter falls back to in-memory (not safe in prod)
            # if this is unset, so verify the ExternalSecret syncs before launch.
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "resumaker.fullname" . }}-redis
                  key: url
          livenessProbe:
            {{- toYaml .Values.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.readinessProbe | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            # readOnlyRootFilesystem requires writable /tmp + Next cache
            - name: tmp
              mountPath: /tmp
            - name: cache
              mountPath: /app/.next/cache
      volumes:
        - name: tmp
          emptyDir: {}
        - name: cache
          emptyDir: {}
      terminationGracePeriodSeconds: 60
