apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "resumaker.fullname" . }}
  labels:
    {{- include "resumaker.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "resumaker.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "resumaker.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "resumaker.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: web
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.targetPort }}
              protocol: TCP
          env:
            {{- range $k, $v := .Values.env }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
            # App secrets (pulled by external-secrets-operator into a k8s secret of the same name)
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "resumaker.fullname" . }}-app
                  key: ANTHROPIC_API_KEY
            - name: BETTER_AUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "resumaker.fullname" . }}-app
                  key: BETTER_AUTH_SECRET
            - name: BETTER_AUTH_URL
              value: {{ .Values.env.APP_URL | quote }}
            - name: RESEND_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "resumaker.fullname" . }}-app
                  key: RESEND_API_KEY
                  optional: true
            - name: SENTRY_DSN
              valueFrom:
                secretKeyRef:
                  name: {{ include "resumaker.fullname" . }}-app
                  key: SENTRY_DSN
                  optional: true
            - name: CRON_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "resumaker.fullname" . }}-app
                  key: CRON_SECRET
                  optional: true
            # DB URL from the RDS-managed secret
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "resumaker.fullname" . }}-db
                  key: url
          livenessProbe:
            {{- toYaml .Values.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.readinessProbe | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            # readOnlyRootFilesystem requires writable /tmp + Next cache
            - name: tmp
              mountPath: /tmp
            - name: cache
              mountPath: /app/.next/cache
      volumes:
        - name: tmp
          emptyDir: {}
        - name: cache
          emptyDir: {}
      terminationGracePeriodSeconds: 60
