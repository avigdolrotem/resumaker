{{- if .Values.cronJobs.scrapeTaasuka.enabled }}
# Taasuka (Israel's national employment service, ~16,700 listings)
# scraper. Separate CronJob from scrape-jobs, on its own much tighter
# schedule — see the route's own doc comment
# (apps/web/src/app/api/cron/scrape-taasuka/route.ts) for why: this is a
# multi-thousand-page crawl that resumes across ticks via a cursor
# persisted in scrapeRuns, not something that fits in one daily run.
#
# concurrencyPolicy: Forbid matters more here than on the other crons —
# two ticks racing on the same saved cursor would each advance it
# independently, silently skipping or duplicating pages.
#
# Auth: Bearer token via CRON_SECRET (must match the value in the
# resumaker-app Secret). Curl-from-inside-the-cluster so the secret
# never leaves the VPC.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "resumaker.fullname" . }}-scrape-taasuka
  labels:
    {{- include "resumaker.labels" . | nindent 4 }}
spec:
  schedule: {{ .Values.cronJobs.scrapeTaasuka.schedule | quote }}
  timeZone: Etc/UTC
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 7
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 120

  jobTemplate:
    spec:
      ttlSecondsAfterFinished: 86400
      backoffLimit: 2
      template:
        metadata:
          labels:
            {{- include "resumaker.selectorLabels" . | nindent 12 }}
            job-type: scrape-taasuka
        spec:
          restartPolicy: OnFailure
          securityContext:
            runAsNonRoot: true
          containers:
            - name: scrape-taasuka
              image: curlimages/curl:8.10.1
              securityContext:
                runAsNonRoot: true
                readOnlyRootFilesystem: true
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
              command:
                - sh
                - -c
                - |
                  set -e
                  curl --fail --show-error --silent \
                    --max-time 290 \
                    -H "Authorization: Bearer $CRON_SECRET" \
                    "http://{{ include "resumaker.fullname" . }}.{{ .Release.Namespace }}.svc.cluster.local/api/cron/scrape-taasuka"
              env:
                - name: CRON_SECRET
                  valueFrom:
                    secretKeyRef:
                      name: {{ include "resumaker.fullname" . }}-app
                      key: CRON_SECRET
              resources:
                requests:
                  cpu: 50m
                  memory: 32Mi
                limits:
                  cpu: 200m
                  memory: 64Mi
{{- end }}
