# Default values — override per environment via values.dev.yaml / values.prod.yaml

image:
  repository: '' # Artifact Registry URL injected by CI: <region>-docker.pkg.dev/<project>/resumaker/web
  tag: latest
  pullPolicy: IfNotPresent

# Migration Job (helm pre-upgrade hook).
#
# Disabled by default: the standalone-image migrator
# (apps/web/scripts/migrate.mjs) hasn't been end-to-end-validated against
# the production schema yet (Phase 9 in docs/SECURITY_AUDIT_2026-05-27.md).
# Production migrations today are run manually via the operator-laptop
# cloud-sql-proxy flow documented in OPERATOR_ACTION_LIST_2026-05-27.md.
# Flip this to `true` once we've validated the migrator on dev/staging
# (and have a tested rollback for a failed migration).
migrationJob:
  enabled: false

replicaCount: 2

resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: 1000m
    memory: 1Gi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70

service:
  type: ClusterIP
  port: 80
  targetPort: 3000

ingress:
  enabled: true
  className: gce # GKE Ingress (Google Cloud Load Balancing)
  annotations:
    kubernetes.io/ingress.class: gce
    # Per-env overlay sets the actual ManagedCertificate name.
    # networking.gke.io/managed-certificates: resumaker-<env>-cert
  hosts:
    - host: resumaker.co.il
      paths:
        - path: /
          pathType: Prefix
  tls: [] # TLS handled by GCP ManagedCertificate (per-env overlay)

# GCP ManagedCertificate — per-env overlay enables + sets domains
# matching the Ingress hosts. Without this the Ingress provisions an
# LB but serves no TLS until an out-of-band kubectl apply happens.
managedCertificate:
  enabled: false
  name: resumaker-cert # overridden per env, e.g. resumaker-prod-cert
  domains: []

# NetworkPolicy egress — VPC CIDR varies per env (dev 10.0.0.0/16,
# staging 10.1.0.0/16, prod 10.2.0.0/16). Per-env overlay sets the
# right value so Cloud SQL + Memorystore are reachable.
networkPolicy:
  enabled: true
  vpcCidr: 10.0.0.0/16

# Probes — hit our /api/health endpoints
livenessProbe:
  httpGet:
    path: /api/health
    port: http
  initialDelaySeconds: 30
  periodSeconds: 15
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /api/health/ready
    port: http
  initialDelaySeconds: 10
  periodSeconds: 5
  failureThreshold: 3

# Env injected from GCP Secret Manager via external-secrets-operator
# (see templates/externalsecret.yaml). Plain envs:
env:
  NODE_ENV: production
  APP_URL: https://resumaker.co.il
  APP_NAME: Resumaker
  DEFAULT_LOCALE: he
  # Active payment provider: 'none' | 'stripe' | 'lemonsqueezy'
  # Flip to 'lemonsqueezy' (or 'stripe') once secrets are populated.
  PAYMENT_PROVIDER: none
  LOG_LEVEL: info
  PLAYWRIGHT_FALLBACK: 'true'

# Pulled from GCP Secret Manager (managed by external-secrets-operator)
secretsManagerName: resumaker-prod/app

# DB credentials come from a Cloud SQL-managed secret separately
dbCredentialsSecretName: resumaker-prod/db-credentials

podDisruptionBudget:
  enabled: true
  minAvailable: 1

# Service account with Workload Identity for GCP API access (Cloud SQL,
# Secret Manager, GCS). The per-env overlay sets the actual annotation:
#   iam.gke.io/gcp-service-account: resumaker-app@resumaker-<env>.iam.gserviceaccount.com
serviceAccount:
  create: true
  annotations: {}

securityContext:
  runAsNonRoot: true
  runAsUser: 1001
  runAsGroup: 1001
  readOnlyRootFilesystem: true
  allowPrivilegeEscalation: false
  capabilities:
    drop: ['ALL']

podSecurityContext:
  fsGroup: 1001
  seccompProfile:
    type: RuntimeDefault

# CronJob configuration.
# All jobs default to disabled so the chart is safe to deploy without
# them. Enable per-environment in the GCP value overlays.
# Schedules follow standard cron syntax (UTC).
cronJobs:
  purge:
    enabled: false
    schedule: '17 3 * * *'
  onboardingEmails:
    enabled: false
    schedule: '0 9 * * *'
  scrapeJobs:
    enabled: true
    schedule: '0 6 * * *'
  pushNotifications:
    enabled: false
    schedule: '0 18 * * *'
