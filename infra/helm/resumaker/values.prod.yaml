# Production overrides
replicaCount: 3

resources:
  requests:
    cpu: 500m
    memory: 1Gi
  limits:
    cpu: 2000m
    memory: 2Gi

autoscaling:
  minReplicas: 3
  maxReplicas: 20
  targetCPUUtilizationPercentage: 60

ingress:
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    # WAF + Cloudflare-IP allowlist managed at ALB
