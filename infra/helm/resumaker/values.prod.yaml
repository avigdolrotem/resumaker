# values.prod.yaml — GKE-specific overrides for prod.

replicaCount: 3

image:
  # Tag injected by CI writing values.prod.image.yaml
  repository: europe-west1-docker.pkg.dev/resumaker-497309/resumaker/web
  pullPolicy: IfNotPresent

resources:
  requests:
    cpu: '200m'
    memory: '512Mi'
  limits:
    cpu: '1000m'
    memory: '1Gi'

autoscaling:
  # Pre-launch cost cut (2026-05-31): dropped 3→1 while pre-launch/no traffic.
  # REVERT to 2–3 before production-ready (HA). HPA still scales up to 20 on load.
  minReplicas: 1
  maxReplicas: 20
  targetCPUUtilizationPercentage: 60

ingress:
  enabled: true
  className: gce
  annotations:
    kubernetes.io/ingress.class: gce
    networking.gke.io/managed-certificates: resumaker-prod-cert
  hosts:
    - host: resumaker.co.il
      paths:
        - path: /
          pathType: Prefix
  tls: [] # TLS handled by GCP managed certificate

managedCertificate:
  enabled: true
  name: resumaker-prod-cert
  domains:
    - resumaker.co.il
    - www.resumaker.co.il

networkPolicy:
  enabled: true
  vpcCidr: 10.2.0.0/16

# Non-secret app config. Real secrets come from the ExternalSecret-managed
# `resumaker-app` k8s Secret (or — currently — a kubectl-applied Secret of
# the same name; see Phase 9 reconciliation).
env:
  NODE_ENV: production
  APP_URL: https://resumaker.co.il
  NEXT_PUBLIC_APP_URL: https://resumaker.co.il
  LOG_LEVEL: info
  GCP_CLOUD_SQL_INSTANCE: resumaker-497309:europe-west1:resumaker-prod-pg-1b94
  GCP_CLOUD_SQL_IAM_USER: resumaker-app@resumaker-497309.iam.gserviceaccount.com
  GCP_CLOUD_SQL_DATABASE: resumaker
  GCP_CLOUD_SQL_IP_TYPE: PRIVATE
  GOOGLE_VERTEX_PROJECT: resumaker-497309
  GOOGLE_VERTEX_LOCATION: europe-west1
  REDIS_URL: rediss://10.130.0.4:6378

# ExternalSecrets — pulls from GCP Secret Manager via Workload Identity.
externalSecrets:
  enabled: true
  refreshInterval: '5m'
  secretStoreName: resumaker-prod-secretstore

# Service account with Workload Identity for GCP API access.
# Name pinned to `resumaker-app` so the WIF binding + ClusterSecretStore
# serviceAccountRef both resolve to the same KSA.
serviceAccount:
  create: true
  name: resumaker-app
  annotations:
    iam.gke.io/gcp-service-account: resumaker-app@resumaker-497309.iam.gserviceaccount.com

# Secrets pulled from GCP Secret Manager (managed by external-secrets-operator)
secretsManagerName: resumaker-prod/app
dbCredentialsSecretName: resumaker-prod/db-credentials

cronJobs:
  purge:
    enabled: true
  onboardingEmails:
    enabled: true
  scrapeJobs:
    enabled: true
  pushNotifications:
    enabled: true
